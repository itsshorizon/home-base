<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 852" role="img" aria-label="Hands-only CPR for a teen or adult who suddenly collapses. Step 1: call 911, or tell someone to call and bring an AED. Step 2: push in the center of the chest. Lay the person on their back on a firm, flat surface. Put the heel of one hand in the center of the chest, between the nipples, with the other hand on top and fingers interlaced. Keep your shoulders over your hands with elbows locked. Press down about 2 inches (5 cm) deep and let the chest come all the way back up. Push at 100 to 120 pushes per minute. Keep going until help takes over, an AED is ready, or the person moves, coughs or breathes normally."><title>Hands-only CPR</title>
<rect x="1.5" y="1.5" width="477" height="849" rx="14" fill="#1f2724" stroke="#2c3632" stroke-width="3"/>
<g font-family="Inter, -apple-system, system-ui, sans-serif" fill="#e8efe9">
<text x="240" y="36" font-size="26" font-weight="800" text-anchor="middle">Hands-only CPR</text>
<rect x="22" y="52" width="436" height="76" rx="12" fill="#2a1a08" stroke="#ff8a1f" stroke-width="3"/>
<circle cx="52" cy="90" r="16" fill="#ff8a1f"/><text x="52" y="96" font-size="18" font-weight="800" text-anchor="middle" fill="#1a0e00">1</text>
<text x="80" y="84" font-size="20" font-weight="800" fill="#ff8a1f">CALL 911</text>
<text x="80" y="108" font-size="15">or tell someone to call and bring an AED.</text>
<circle cx="40" cy="160" r="16" fill="#ff8a1f"/><text x="40" y="166" font-size="18" font-weight="800" text-anchor="middle" fill="#1a0e00">2</text>
<text x="66" y="166" font-size="18" font-weight="800">PUSH in the center of the chest</text>
<circle cx="130" cy="212" r="22" fill="#161c1a" stroke="#e8efe9" stroke-width="4"/>
<rect x="68" y="244" width="124" height="170" rx="36" fill="#161c1a" stroke="#e8efe9" stroke-width="4"/>
<circle cx="96" cy="306" r="6" fill="none" stroke="#9aa8a0" stroke-width="3"/><circle cx="164" cy="306" r="6" fill="none" stroke="#9aa8a0" stroke-width="3"/>
<line x1="104" y1="306" x2="156" y2="306" stroke="#9aa8a0" stroke-width="3" stroke-dasharray="4 4"/>
<rect x="108" y="292" width="44" height="40" rx="10" fill="#ff8a1f" opacity="0.9"/>
<rect x="114" y="284" width="44" height="40" rx="10" fill="none" stroke="#e8efe9" stroke-width="3.5"/>
<line x1="164" y1="316" x2="164" y2="316" stroke="none"/>
<line x1="160" y1="312" x2="236" y2="312" stroke="#ff8a1f" stroke-width="3"/><circle cx="160" cy="312" r="4" fill="#ff8a1f"/>
<text x="244" y="300" font-size="16" font-weight="800" fill="#ff8a1f">Heel of one hand:</text>
<text x="244" y="322" font-size="16" fill="#e8efe9">center of the chest,</text>
<text x="244" y="344" font-size="16" fill="#e8efe9">between the nipples.</text>
<text x="244" y="378" font-size="16">Other hand on top,</text>
<text x="244" y="400" font-size="16">fingers interlaced.</text>
<text x="24" y="446" font-size="15" fill="#9aa8a0">On their back, on a firm, flat surface.</text>
<rect x="22" y="470" width="436" height="214" rx="12" fill="#161c1a" stroke="#9aa8a0" stroke-width="3"/>
<line x1="34" y1="662" x2="446" y2="662" stroke="#9aa8a0" stroke-width="5"/>
<rect x="60" y="616" width="200" height="46" rx="20" fill="#161c1a" stroke="#e8efe9" stroke-width="4"/>
<circle cx="52" cy="638" r="0" fill="none"/>
<circle cx="170" cy="504" r="14" fill="#161c1a" stroke="#e8efe9" stroke-width="4"/>
<line x1="170" y1="518" x2="170" y2="606" stroke="#e8efe9" stroke-width="8" stroke-linecap="round"/>
<rect x="152" y="598" width="36" height="16" rx="6" fill="#ff8a1f"/>
<text x="196" y="500" font-size="14" font-weight="700" text-anchor="start">Shoulders over</text>
<text x="196" y="518" font-size="14" font-weight="700" text-anchor="start">your hands,</text>
<text x="196" y="536" font-size="14" font-weight="700" text-anchor="start">elbows locked</text>
<line x1="126" y1="584" x2="126.0" y2="611.0" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/><polygon points="126.0,622.0 119.0,611.0 133.0,611.0" fill="#ef4444"/>
<text x="118" y="560" font-size="15" font-weight="800" text-anchor="end" fill="#ef4444">Press down</text>
<text x="118" y="579" font-size="15" font-weight="800" text-anchor="end" fill="#ef4444">about</text>
<text x="348" y="568" font-size="20" font-weight="800" text-anchor="middle" fill="#ff8a1f">about 2 inches</text>
<text x="348" y="592" font-size="20" font-weight="800" text-anchor="middle" fill="#ff8a1f">(5 cm) deep</text>
<text x="348" y="626" font-size="15" text-anchor="middle">Let the chest come all</text>
<text x="348" y="646" font-size="15" text-anchor="middle">the way back up.</text>
<rect x="22" y="698" width="436" height="92" rx="12" fill="#2a1a08" stroke="#ff8a1f" stroke-width="4"/>
<path d="M36,754 H64 L76,728 L92,774 L104,742 L112,754 H134" fill="none" stroke="#ff8a1f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="150" y="740" font-size="26" font-weight="800" fill="#ff8a1f">100 to 120</text>
<text x="150" y="770" font-size="18" font-weight="700">pushes per minute</text>
<text x="24" y="814" font-size="15" fill="#9aa8a0">Keep going until help takes over, an AED is ready,</text>
<text x="24" y="834" font-size="15" fill="#9aa8a0">or the person moves, coughs or breathes normally.</text>
</g></svg>
