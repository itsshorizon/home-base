<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 692" role="img" aria-label="Where a tourniquet goes on an arm or leg. Put it between the wound and the heart, at least 2 to 3 inches from the wound, and it can go over clothing. If you cannot judge that spot, FEMA says to put it as high up the limb as possible, close to the torso. Do not put it over a joint such as the elbow, knee, wrist or ankle; if a joint is in the way, go above it, toward the body. Pull the strap tight, twist the rod until the bleeding stops or slows a lot, and lock it. Write down the time, and do not loosen it. The drawing is not to scale."><title>Tourniquet placement</title>
<rect x="1.5" y="1.5" width="477" height="689" rx="14" fill="#1f2724" stroke="#2c3632" stroke-width="3"/>
<g font-family="Inter, -apple-system, system-ui, sans-serif" fill="#e8efe9">
<text x="240" y="36" font-size="24" font-weight="800" text-anchor="middle">Tourniquet: where it goes</text>
<text x="240" y="60" font-size="16" text-anchor="middle" fill="#9aa8a0">Arm or leg only. Call 911.</text>
<rect x="22" y="100" width="62" height="132" rx="14" fill="#161c1a" stroke="#e8efe9" stroke-width="4"/>
<path d="M53,154 C44,142 34,154 53,174 C72,154 62,142 53,154Z" fill="#ef4444"/>
<text x="53" y="90" font-size="14" font-weight="800" text-anchor="middle" fill="#ef4444">HEART</text>
<rect x="84" y="140" width="372" height="52" rx="14" fill="#161c1a" stroke="#e8efe9" stroke-width="4"/>
<line x1="196" y1="140" x2="196" y2="192" stroke="#9aa8a0" stroke-width="3" stroke-dasharray="4 4"/>
<line x1="250" y1="126" x2="121.0" y2="126.0" stroke="#9aa8a0" stroke-width="3.5" stroke-linecap="round"/><polygon points="110.0,126.0 121.0,119.0 121.0,133.0" fill="#9aa8a0"/>
<text x="180" y="116" font-size="14" font-weight="700" text-anchor="middle" fill="#9aa8a0">toward the heart</text>
<circle cx="402" cy="166.0" r="15" fill="#ef4444"/>
<text x="402" y="126" font-size="15" font-weight="700" text-anchor="middle" fill="#ef4444">Wound</text>
<rect x="307" y="130" width="18" height="72" rx="4" fill="#ff8a1f" stroke="#1a0e00" stroke-width="2"/>
<circle cx="316" cy="106" r="15" fill="#ff8a1f"/><text x="316" y="112" font-size="18" font-weight="800" text-anchor="middle" fill="#1a0e00">1</text>
<line x1="330" y1="208" x2="375.0" y2="208.0" stroke="#ff8a1f" stroke-width="3" stroke-linecap="round"/><polygon points="386.0,208.0 375.0,215.0 375.0,201.0" fill="#ff8a1f"/>
<line x1="386" y1="208" x2="341.0" y2="208.0" stroke="#ff8a1f" stroke-width="3" stroke-linecap="round"/><polygon points="330.0,208.0 341.0,201.0 341.0,215.0" fill="#ff8a1f"/>
<text x="350" y="236" font-size="15" font-weight="700" text-anchor="middle" fill="#ff8a1f">at least</text>
<text x="350" y="256" font-size="15" font-weight="700" text-anchor="middle" fill="#ff8a1f">2 to 3 inches</text>
<rect x="107" y="130" width="18" height="72" rx="4" fill="none" stroke="#22c55e" stroke-width="4" stroke-dasharray="5 4"/>
<circle cx="116" cy="226" r="15" fill="#22c55e"/><text x="116" y="232" font-size="18" font-weight="800" text-anchor="middle" fill="#0d1110">2</text>
<rect x="187" y="130" width="18" height="72" rx="4" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="5 4"/>
<circle cx="196" cy="226" r="13" fill="#ef4444"/><path d="M189.5,219.5 L202.5,232.5 M202.5,219.5 L189.5,232.5" fill="none" stroke="#0d1110" stroke-width="4.5" stroke-linecap="round"/>
<text x="196" y="258" font-size="14" font-weight="700" text-anchor="middle" fill="#ef4444">joint</text>
<text x="24" y="302" font-size="14" fill="#9aa8a0">Not to scale.</text>
<rect x="22" y="318" width="436" height="86" rx="10" fill="#161c1a" stroke="#ff8a1f" stroke-width="3"/>
<circle cx="48" cy="361.0" r="15" fill="#ff8a1f"/><text x="48" y="367.0" font-size="18" font-weight="800" text-anchor="middle" fill="#1a0e00">1</text>
<text x="76" y="345.0" font-size="16">Between the wound and the heart,</text>
<text x="76" y="367.0" font-size="16">at least 2 to 3 inches from the wound.</text>
<text x="76" y="389.0" font-size="16">It can go over clothing.</text>
<rect x="22" y="412" width="436" height="64" rx="10" fill="#161c1a" stroke="#22c55e" stroke-width="3"/>
<circle cx="48" cy="444.0" r="15" fill="#22c55e"/><text x="48" y="450.0" font-size="18" font-weight="800" text-anchor="middle" fill="#0d1110">2</text>
<text x="76" y="439.0" font-size="16">Can't judge that spot? FEMA: as high up</text>
<text x="76" y="461.0" font-size="16">the limb as possible, close to the torso.</text>
<rect x="22" y="484" width="436" height="86" rx="10" fill="#161c1a" stroke="#ef4444" stroke-width="3"/>
<circle cx="48" cy="527.0" r="15" fill="#ef4444"/><path d="M41.5,520.5 L54.5,533.5 M54.5,520.5 L41.5,533.5" fill="none" stroke="#0d1110" stroke-width="4.5" stroke-linecap="round"/>
<text x="76" y="511.0" font-size="16">Not over a joint (elbow, knee, wrist,</text>
<text x="76" y="533.0" font-size="16">ankle). If one is in the way, go above it,</text>
<text x="76" y="555.0" font-size="16">toward the body.</text>
<rect x="22" y="578" width="436" height="98" rx="12" fill="#2a1a08" stroke="#ff8a1f" stroke-width="3"/>
<text x="38" y="606" font-size="16">Pull tight. Twist the rod until bleeding</text>
<text x="38" y="628" font-size="16">stops or slows a lot. Lock it.</text>
<text x="38" y="656" font-size="16" font-weight="800" fill="#ff8a1f">Write down the time. Don't loosen it.</text>
</g></svg>
