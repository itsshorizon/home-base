<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 852" role="img" aria-label="Squeeze filter, filter then backflush. 1, filter: dirty water goes through the filter into a clean container. Let dirty water settle or pour it through a cloth first, and do not attach the filter to a bucket that held chemicals. Most portable filters do not remove viruses, so after filtering boil the water or add chlorine, chlorine dioxide or iodine. 2, backflush: when flow slows, backflush straight into your bucket for about a minute, and the flow is restored. Backflush before first use, when flow starts to drop, before long storage, and when you take it out of storage, and after each bucket of water or at least once a day. Never backflush with dirty water. Freezing ruins the filter: keep a wet filter above freezing and replace it if it may have frozen. Safe range 32 to 140 degrees Fahrenheit."><title>Squeeze filter and backflush</title>
<rect x="1.5" y="1.5" width="477" height="849" rx="14" fill="#1f2724" stroke="#2c3632" stroke-width="3"/>
<g font-family="Inter, -apple-system, system-ui, sans-serif" fill="#e8efe9">
<text x="240" y="36" font-size="22" font-weight="700" text-anchor="middle">Squeeze filter: filter, then backflush</text>
<rect x="22" y="54" width="436" height="36" rx="10" fill="#38bdf8"/><text x="38" y="79" font-size="19" font-weight="800" fill="#0d1110">1   FILTER</text>
<path d="M30,104 H122 L112,188 H40 Z" fill="#161c1a" stroke="#e8efe9" stroke-width="4" stroke-linejoin="round"/><path d="M33,118 H119 L112,186 H40 Z" fill="#38bdf8" opacity="0.4"/>
<text x="76" y="214" font-size="16" font-weight="700" text-anchor="middle">Dirty water</text>
<line x1="128" y1="148" x2="163.0" y2="148.0" stroke="#e8efe9" stroke-width="4" stroke-linecap="round"/><polygon points="174.0,148.0 163.0,155.0 163.0,141.0" fill="#e8efe9"/>
<rect x="180" y="120" width="120" height="56" rx="28" fill="#161c1a" stroke="#38bdf8" stroke-width="4"/>
<text x="240" y="155" font-size="18" font-weight="800" text-anchor="middle">FILTER</text>
<line x1="306" y1="148" x2="341.0" y2="148.0" stroke="#e8efe9" stroke-width="4" stroke-linecap="round"/><polygon points="352.0,148.0 341.0,155.0 341.0,141.0" fill="#e8efe9"/>
<path d="M360,104 H440 L430,188 H370 Z" fill="#161c1a" stroke="#e8efe9" stroke-width="4" stroke-linejoin="round"/><path d="M363,118 H437 L430,186 H370 Z" fill="#38bdf8" opacity="0.4"/>
<text x="400" y="214" font-size="16" font-weight="700" text-anchor="middle">Filtered water</text>
<text x="24" y="250" font-size="16">Dirty water: let it settle, or pour it through a cloth first.</text>
<text x="24" y="276" font-size="16" font-weight="700" fill="#ef4444">✕ Don't attach it to a bucket that held chemicals.</text>
<rect x="22" y="294" width="436" height="104" rx="12" fill="#2a1a08" stroke="#ff8a1f" stroke-width="3"/>
<text x="38" y="322" font-size="16" font-weight="800" fill="#ff8a1f">Viruses? Most portable filters don't remove them.</text>
<text x="38" y="348" font-size="16">After filtering, boil the water, or add a disinfectant:</text>
<text x="38" y="374" font-size="16">chlorine, chlorine dioxide or iodine.</text>
<rect x="22" y="416" width="436" height="36" rx="10" fill="#38bdf8"/><text x="38" y="441" font-size="19" font-weight="800" fill="#0d1110">2   BACKFLUSH</text>
<rect x="22" y="466" width="128" height="64" rx="12" fill="#161c1a" stroke="#f5a524" stroke-width="3"/>
<text x="86" y="494" font-size="17" font-weight="700" text-anchor="middle">Flow</text>
<text x="86" y="516" font-size="17" font-weight="700" text-anchor="middle">slows</text>
<line x1="154" y1="498" x2="169.0" y2="498.0" stroke="#e8efe9" stroke-width="4" stroke-linecap="round"/><polygon points="180.0,498.0 169.0,505.0 169.0,491.0" fill="#e8efe9"/>
<rect x="184" y="466" width="112" height="64" rx="12" fill="#161c1a" stroke="#38bdf8" stroke-width="3"/>
<text x="240" y="504" font-size="17" font-weight="800" text-anchor="middle" fill="#38bdf8">Backflush</text>
<line x1="300" y1="498" x2="315.0" y2="498.0" stroke="#e8efe9" stroke-width="4" stroke-linecap="round"/><polygon points="326.0,498.0 315.0,505.0 315.0,491.0" fill="#e8efe9"/>
<rect x="330" y="466" width="128" height="64" rx="12" fill="#161c1a" stroke="#22c55e" stroke-width="3"/>
<text x="394" y="494" font-size="17" font-weight="700" text-anchor="middle" fill="#22c55e">✓ Flow</text>
<text x="394" y="516" font-size="17" font-weight="700" text-anchor="middle" fill="#22c55e">restored</text>
<text x="24" y="562" font-size="16" font-weight="700">Backflush straight into your bucket. About a minute.</text>
<text x="24" y="592" font-size="16" font-weight="700" fill="#9aa8a0">When:</text>
<text x="80" y="592" font-size="16">before first use, when flow starts to drop,</text>
<text x="80" y="616" font-size="16">before long storage, and when you take it out</text>
<text x="80" y="640" font-size="16">of storage.</text>
<text x="24" y="672" font-size="16">How often: after each bucket of water, or at least once a day.</text>
<text x="24" y="704" font-size="16" font-weight="800" fill="#ef4444">✕ Don't backflush with dirty water.</text>
<rect x="22" y="724" width="436" height="112" rx="12" fill="#2a1010" stroke="#ef4444" stroke-width="3"/>
<text x="38" y="754" font-size="18" font-weight="800" fill="#ef4444">✕ Freezing ruins the filter.</text>
<text x="38" y="782" font-size="16">Keep a wet filter above freezing.</text>
<text x="38" y="806" font-size="16">If it may have frozen, replace it.</text>
<text x="38" y="830" font-size="16" fill="#9aa8a0">Safe range: 32°F to 140°F.</text>
</g></svg>
