<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1146" role="img" aria-label="Which water can I drink. Safest first: bottled, then stored tap, then house water, outdoor water last. Do not drink: flood water, radiator or boiler water, tap water under a do-not-drink advisory, water that smells of fuel or has a sheen, or pool and spa water. Treat first, then drink: tap water under a boil-water advisory (rolling boil for 1 minute), creek, river, pond or lake water, rainwater as a last resort, and a flooded private well after disinfection and testing. Treat in this order: settle and strain, filter if you have a portable filter, then boil for 1 minute or use bleach for 30 minutes or tablets by the label."><title>Which water can I drink</title>
<rect x="1.5" y="1.5" width="477" height="1143" rx="14" fill="#1f2724" stroke="#2c3632" stroke-width="3"/>
<g font-family="Inter, -apple-system, system-ui, sans-serif" fill="#e8efe9">
<text x="240" y="38" font-size="24" font-weight="700" text-anchor="middle">Which water can I drink?</text>
<text x="24" y="72" font-size="16" font-weight="700" fill="#9aa8a0">Safest first</text>
<rect x="24" y="82" width="96" height="52" rx="10" fill="#161c1a" stroke="#22c55e" stroke-width="3"/>
<text x="72" y="114" font-size="16" font-weight="700" text-anchor="middle">Bottled</text>
<line x1="123" y1="108" x2="127.0" y2="108.0" stroke="#9aa8a0" stroke-width="3" stroke-linecap="round"/><polygon points="138.0,108.0 127.0,115.0 127.0,101.0" fill="#9aa8a0"/>
<rect x="136" y="82" width="96" height="52" rx="10" fill="#161c1a" stroke="#9aa8a0" stroke-width="3"/>
<text x="184" y="104" font-size="16" font-weight="700" text-anchor="middle">Stored</text>
<text x="184" y="124" font-size="16" font-weight="700" text-anchor="middle">tap</text>
<line x1="235" y1="108" x2="239.0" y2="108.0" stroke="#9aa8a0" stroke-width="3" stroke-linecap="round"/><polygon points="250.0,108.0 239.0,115.0 239.0,101.0" fill="#9aa8a0"/>
<rect x="248" y="82" width="96" height="52" rx="10" fill="#161c1a" stroke="#9aa8a0" stroke-width="3"/>
<text x="296" y="104" font-size="16" font-weight="700" text-anchor="middle">House</text>
<text x="296" y="124" font-size="16" font-weight="700" text-anchor="middle">water</text>
<line x1="347" y1="108" x2="351.0" y2="108.0" stroke="#9aa8a0" stroke-width="3" stroke-linecap="round"/><polygon points="362.0,108.0 351.0,115.0 351.0,101.0" fill="#9aa8a0"/>
<rect x="360" y="82" width="96" height="52" rx="10" fill="#161c1a" stroke="#ff8a1f" stroke-width="3"/>
<text x="408" y="114" font-size="16" font-weight="700" text-anchor="middle">Outdoor</text>
<text x="24" y="156" font-size="16" fill="#9aa8a0">Outdoor water is last.</text>
<rect x="22" y="178" width="436" height="38" rx="10" fill="#ef4444"/><text x="40" y="204" font-size="19" font-weight="800" fill="#0d1110">✕  DON'T DRINK</text><rect x="22" y="226" width="176" height="54" rx="10" fill="#161c1a" stroke="#ef4444" stroke-width="3"/><text x="34" y="259.0" font-size="16" font-weight="700">Flood water</text><line x1="202" y1="253.0" x2="213.0" y2="253.0" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/><polygon points="224.0,253.0 213.0,260.0 213.0,246.0" fill="#ef4444"/><rect x="228" y="226" width="230" height="54" rx="10" fill="#161c1a" stroke="#ef4444" stroke-width="3"/><text x="240" y="249.0" font-size="16">No. Don't drink it,</text><text x="240" y="269.0" font-size="16">wash with it or wade in it.</text><rect x="22" y="288" width="176" height="54" rx="10" fill="#161c1a" stroke="#ef4444" stroke-width="3"/><text x="34" y="311.0" font-size="16" font-weight="700">Radiators,</text><text x="34" y="331.0" font-size="16" font-weight="700">boilers</text><line x1="202" y1="315.0" x2="213.0" y2="315.0" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/><polygon points="224.0,315.0 213.0,322.0 213.0,308.0" fill="#ef4444"/><rect x="228" y="288" width="230" height="54" rx="10" fill="#161c1a" stroke="#ef4444" stroke-width="3"/><text x="240" y="311.0" font-size="16">No. Never use water</text><text x="240" y="331.0" font-size="16">from a heating system.</text><rect x="22" y="350" width="176" height="54" rx="10" fill="#161c1a" stroke="#ef4444" stroke-width="3"/><text x="34" y="373.0" font-size="16" font-weight="700">Tap: do-not-</text><text x="34" y="393.0" font-size="16" font-weight="700">drink advisory</text><line x1="202" y1="377.0" x2="213.0" y2="377.0" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/><polygon points="224.0,377.0 213.0,384.0 213.0,370.0" fill="#ef4444"/><rect x="228" y="350" width="230" height="54" rx="10" fill="#161c1a" stroke="#ef4444" stroke-width="3"/><text x="240" y="373.0" font-size="16">No. Boiling doesn't fix</text><text x="240" y="393.0" font-size="16">chemicals. Use bottled.</text><rect x="22" y="412" width="176" height="54" rx="10" fill="#161c1a" stroke="#ef4444" stroke-width="3"/><text x="34" y="435.0" font-size="16" font-weight="700">Fuel smell, sheen,</text><text x="34" y="455.0" font-size="16" font-weight="700">or chemicals</text><line x1="202" y1="439.0" x2="213.0" y2="439.0" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/><polygon points="224.0,439.0 213.0,446.0 213.0,432.0" fill="#ef4444"/><rect x="228" y="412" width="230" height="54" rx="10" fill="#161c1a" stroke="#ef4444" stroke-width="3"/><text x="240" y="435.0" font-size="16">Don't drink or treat it.</text><text x="240" y="455.0" font-size="16">Not boiled or filtered out.</text><rect x="22" y="474" width="176" height="54" rx="10" fill="#161c1a" stroke="#ef4444" stroke-width="3"/><text x="34" y="507.0" font-size="16" font-weight="700">Pool or spa</text><line x1="202" y1="501.0" x2="213.0" y2="501.0" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/><polygon points="224.0,501.0 213.0,508.0 213.0,494.0" fill="#ef4444"/><rect x="228" y="474" width="230" height="54" rx="10" fill="#161c1a" stroke="#ef4444" stroke-width="3"/><text x="240" y="497.0" font-size="16">Not for drinking. Wash</text><text x="240" y="517.0" font-size="16">and clean only.</text>
<rect x="22" y="542" width="436" height="38" rx="10" fill="#ff8a1f"/><text x="40" y="568" font-size="19" font-weight="800" fill="#0d1110">✓  TREAT FIRST, THEN DRINK</text><rect x="22" y="590" width="176" height="54" rx="10" fill="#161c1a" stroke="#ff8a1f" stroke-width="3"/><text x="34" y="613.0" font-size="16" font-weight="700">Tap: boil-water</text><text x="34" y="633.0" font-size="16" font-weight="700">advisory</text><line x1="202" y1="617.0" x2="213.0" y2="617.0" stroke="#ff8a1f" stroke-width="3" stroke-linecap="round"/><polygon points="224.0,617.0 213.0,624.0 213.0,610.0" fill="#ff8a1f"/><rect x="228" y="590" width="230" height="54" rx="10" fill="#161c1a" stroke="#ff8a1f" stroke-width="3"/><text x="240" y="613.0" font-size="16">Rolling boil 1 minute,</text><text x="240" y="633.0" font-size="16">then cool.</text><rect x="22" y="652" width="176" height="44" rx="10" fill="#161c1a" stroke="#ff8a1f" stroke-width="3"/><text x="34" y="680.0" font-size="16" font-weight="700">Creek or river</text><line x1="202" y1="674.0" x2="213.0" y2="674.0" stroke="#ff8a1f" stroke-width="3" stroke-linecap="round"/><polygon points="224.0,674.0 213.0,681.0 213.0,667.0" fill="#ff8a1f"/><rect x="228" y="652" width="230" height="44" rx="10" fill="#161c1a" stroke="#ff8a1f" stroke-width="3"/><text x="240" y="680.0" font-size="16">Treat it (steps below).</text><rect x="22" y="704" width="176" height="54" rx="10" fill="#161c1a" stroke="#ff8a1f" stroke-width="3"/><text x="34" y="737.0" font-size="16" font-weight="700">Pond or lake</text><line x1="202" y1="731.0" x2="213.0" y2="731.0" stroke="#ff8a1f" stroke-width="3" stroke-linecap="round"/><polygon points="224.0,731.0 213.0,738.0 213.0,724.0" fill="#ff8a1f"/><rect x="228" y="704" width="230" height="54" rx="10" fill="#161c1a" stroke="#ff8a1f" stroke-width="3"/><text x="240" y="727.0" font-size="16">Treat it. Still water</text><text x="240" y="747.0" font-size="16">is worse than flowing.</text><rect x="22" y="766" width="176" height="54" rx="10" fill="#161c1a" stroke="#ff8a1f" stroke-width="3"/><text x="34" y="799.0" font-size="16" font-weight="700">Rainwater</text><line x1="202" y1="793.0" x2="213.0" y2="793.0" stroke="#ff8a1f" stroke-width="3" stroke-linecap="round"/><polygon points="224.0,793.0 213.0,800.0 213.0,786.0" fill="#ff8a1f"/><rect x="228" y="766" width="230" height="54" rx="10" fill="#161c1a" stroke="#ff8a1f" stroke-width="3"/><text x="240" y="789.0" font-size="16">Last resort. Treat it</text><text x="240" y="809.0" font-size="16">(steps below).</text><rect x="22" y="828" width="176" height="54" rx="10" fill="#161c1a" stroke="#ff8a1f" stroke-width="3"/><text x="34" y="851.0" font-size="16" font-weight="700">Flooded private</text><text x="34" y="871.0" font-size="16" font-weight="700">well</text><line x1="202" y1="855.0" x2="213.0" y2="855.0" stroke="#ff8a1f" stroke-width="3" stroke-linecap="round"/><polygon points="224.0,855.0 213.0,862.0 213.0,848.0" fill="#ff8a1f"/><rect x="228" y="828" width="230" height="54" rx="10" fill="#161c1a" stroke="#ff8a1f" stroke-width="3"/><text x="240" y="851.0" font-size="16">Disinfect, test, and call</text><text x="240" y="871.0" font-size="16">the health department.</text>
<rect x="22" y="896" width="436" height="36" rx="10" fill="#38bdf8"/>
<text x="40" y="921" font-size="19" font-weight="800" fill="#0d1110">TREAT IN THIS ORDER</text>
<rect x="22" y="942" width="436" height="54" rx="10" fill="#161c1a" stroke="#38bdf8" stroke-width="3"/>
<circle cx="48" cy="969.0" r="15" fill="#38bdf8"/><text x="48" y="975.0" font-size="18" font-weight="800" text-anchor="middle" fill="#0d1110">1</text>
<text x="76" y="965.0" font-size="16">Let it settle. Strain it through a cloth,</text>
<text x="76" y="985.0" font-size="16">paper towel or coffee filter.</text>
<line x1="240" y1="998" x2="240.0" y2="1001.0" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/><polygon points="240.0,1012.0 233.0,1001.0 247.0,1001.0" fill="#38bdf8"/>
<rect x="22" y="1014" width="436" height="44" rx="10" fill="#161c1a" stroke="#38bdf8" stroke-width="3"/>
<circle cx="48" cy="1036.0" r="15" fill="#38bdf8"/><text x="48" y="1042.0" font-size="18" font-weight="800" text-anchor="middle" fill="#0d1110">2</text>
<text x="76" y="1042.0" font-size="16">Filter it, if you have a portable filter.</text>
<line x1="240" y1="1060" x2="240.0" y2="1063.0" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/><polygon points="240.0,1074.0 233.0,1063.0 247.0,1063.0" fill="#38bdf8"/>
<rect x="22" y="1076" width="436" height="54" rx="10" fill="#161c1a" stroke="#38bdf8" stroke-width="3"/>
<circle cx="48" cy="1103.0" r="15" fill="#38bdf8"/><text x="48" y="1109.0" font-size="18" font-weight="800" text-anchor="middle" fill="#0d1110">3</text>
<text x="76" y="1099.0" font-size="16">Then boil 1 minute, or bleach (30 minutes),</text>
<text x="76" y="1119.0" font-size="16">or tablets (follow the label).</text>
</g></svg>
