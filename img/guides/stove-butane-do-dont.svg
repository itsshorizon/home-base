<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 748" role="img" aria-label="Butane stove, do and don't. If the label says outdoor use only, use it outside. Do: pan over the burner only, and check your stove's pan limit. Do: use it outdoors, out of the wind, on a flat, stable, heat-resistant surface, at least 3 feet from anything that burns (Eureka's number). Do not: put a pan over the canister, because heat bounces back and it can explode. Do not use it in a home, tent, car, camper or apartment. Do not leave it lit and unattended. Do not check for leaks with a flame: use soapy water, and bubbles mean a leak."><title>Butane stove do and don't</title>
<rect x="1.5" y="1.5" width="477" height="745" rx="14" fill="#1f2724" stroke="#2c3632" stroke-width="3"/>
<g font-family="Inter, -apple-system, system-ui, sans-serif" fill="#e8efe9">
<text x="240" y="36" font-size="24" font-weight="700" text-anchor="middle">Butane stove: do and don't</text>
<rect x="22" y="52" width="436" height="56" rx="12" fill="#2a1a08" stroke="#ff8a1f" stroke-width="3"/>
<text x="240" y="76" font-size="17" font-weight="700" text-anchor="middle">Label says outdoor use only?</text>
<text x="240" y="98" font-size="19" font-weight="800" text-anchor="middle" fill="#ff8a1f">Use it outside.</text>
<rect x="22" y="122" width="212" height="222" rx="12" fill="#161c1a" stroke="#22c55e" stroke-width="3"/><text x="128" y="152" font-size="19" font-weight="800" text-anchor="middle" fill="#22c55e">✓ DO</text><rect x="34" y="182" width="188" height="64" rx="8" fill="#1f2724" stroke="#9aa8a0" stroke-width="3"/><rect x="152" y="190" width="62" height="48" rx="6" fill="#161c1a" stroke="#ff8a1f" stroke-width="3"/><text x="183" y="219" font-size="14" font-weight="700" text-anchor="middle" fill="#ff8a1f">canister</text><circle cx="82" cy="214" r="11" fill="#ff8a1f"/><circle cx="82" cy="214" r="34" fill="#22c55e" fill-opacity="0.18" stroke="#22c55e" stroke-width="4"/><text x="128" y="280" font-size="16" font-weight="700" text-anchor="middle">Pan over the burner</text><text x="128" y="302" font-size="15" text-anchor="middle" fill="#9aa8a0">only. Check your</text><text x="128" y="322" font-size="15" text-anchor="middle" fill="#9aa8a0">stove's pan limit.</text>
<rect x="246" y="122" width="212" height="222" rx="12" fill="#161c1a" stroke="#ef4444" stroke-width="3"/><text x="352" y="152" font-size="19" font-weight="800" text-anchor="middle" fill="#ef4444">✕ DON'T</text><rect x="258" y="182" width="188" height="64" rx="8" fill="#1f2724" stroke="#9aa8a0" stroke-width="3"/><rect x="376" y="190" width="62" height="48" rx="6" fill="#161c1a" stroke="#ff8a1f" stroke-width="3"/><text x="407" y="219" font-size="14" font-weight="700" text-anchor="middle" fill="#ff8a1f">canister</text><circle cx="306" cy="214" r="11" fill="#ff8a1f"/><circle cx="340" cy="214" r="54" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="4"/><text x="352" y="280" font-size="16" font-weight="700" text-anchor="middle">Pan over the canister:</text><text x="352" y="302" font-size="15" text-anchor="middle" fill="#9aa8a0">heat bounces back and</text><text x="352" y="322" font-size="15" text-anchor="middle" fill="#9aa8a0">it can explode.</text>
<rect x="22" y="362" width="436" height="44" rx="10" fill="#161c1a" stroke="#22c55e" stroke-width="3"/><circle cx="50" cy="384.0" r="15" fill="#22c55e"/><path d="M43,384.0 L48,390.0 L58,378.0" fill="none" stroke="#0d1110" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text x="78" y="390.0" font-size="16">Outdoors, out of the wind</text><rect x="22" y="414" width="436" height="44" rx="10" fill="#161c1a" stroke="#22c55e" stroke-width="3"/><circle cx="50" cy="436.0" r="15" fill="#22c55e"/><path d="M43,436.0 L48,442.0 L58,430.0" fill="none" stroke="#0d1110" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text x="78" y="442.0" font-size="16">Flat, stable, heat-resistant surface</text><rect x="22" y="466" width="436" height="66" rx="10" fill="#161c1a" stroke="#22c55e" stroke-width="3"/><circle cx="50" cy="499.0" r="15" fill="#22c55e"/><path d="M43,499.0 L48,505.0 L58,493.0" fill="none" stroke="#0d1110" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text x="78" y="494.0" font-size="16">At least 3 feet from anything that</text><text x="78" y="516.0" font-size="16">burns (Eureka's number)</text><rect x="22" y="540" width="436" height="66" rx="10" fill="#161c1a" stroke="#ef4444" stroke-width="3"/><circle cx="50" cy="573.0" r="15" fill="#ef4444"/><path d="M43.5,566.5 L56.5,579.5 M56.5,566.5 L43.5,579.5" fill="none" stroke="#0d1110" stroke-width="4.5" stroke-linecap="round"/><text x="78" y="568.0" font-size="16">In a home, tent, car, camper or</text><text x="78" y="590.0" font-size="16">apartment</text><rect x="22" y="614" width="436" height="44" rx="10" fill="#161c1a" stroke="#ef4444" stroke-width="3"/><circle cx="50" cy="636.0" r="15" fill="#ef4444"/><path d="M43.5,629.5 L56.5,642.5 M56.5,629.5 L43.5,642.5" fill="none" stroke="#0d1110" stroke-width="4.5" stroke-linecap="round"/><text x="78" y="642.0" font-size="16">Leave it lit and unattended</text><rect x="22" y="666" width="436" height="66" rx="10" fill="#161c1a" stroke="#ef4444" stroke-width="3"/><circle cx="50" cy="699.0" r="15" fill="#ef4444"/><path d="M43.5,692.5 L56.5,705.5 M56.5,692.5 L43.5,705.5" fill="none" stroke="#0d1110" stroke-width="4.5" stroke-linecap="round"/><text x="78" y="694.0" font-size="16">Check for leaks with a flame.</text><text x="78" y="716.0" font-size="16">Soapy water: bubbles mean a leak.</text>
</g></svg>
