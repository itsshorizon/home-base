<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 880" role="img" aria-label="Choking: abdominal thrusts for an adult or child over 1 year who is awake. Act only if they cannot speak, cough or breathe, and have someone call 911 as you start. Give 5 back blows, then 5 abdominal thrusts, and keep alternating 5 and 5. For thrusts, stand behind the person and wrap your arms around the waist. Make a fist with the thumb side against the belly, just above the navel and well below the breastbone, grab the fist with your other hand, and pull sharply inward and upward. For a pregnant or very large person, give 5 chest thrusts instead, with the fist on the middle of the breastbone, thrusting firmly backward."><title>Abdominal thrusts for choking</title>
<rect x="1.5" y="1.5" width="477" height="877" rx="14" fill="#1f2724" stroke="#2c3632" stroke-width="3"/>
<g font-family="Inter, -apple-system, system-ui, sans-serif" fill="#e8efe9">
<text x="240" y="36" font-size="23" font-weight="800" text-anchor="middle">Choking: abdominal thrusts</text>
<rect x="22" y="50" width="436" height="70" rx="12" fill="#2a1010" stroke="#ef4444" stroke-width="3"/>
<text x="38" y="76" font-size="16" font-weight="800" fill="#ef4444">Only if they can't speak, cough or breathe.</text>
<text x="38" y="100" font-size="16">Have someone call 911 as you start.</text>
<rect x="22" y="134" width="196" height="52" rx="12" fill="#161c1a" stroke="#ff8a1f" stroke-width="4"/>
<text x="120" y="158" font-size="18" font-weight="800" text-anchor="middle">5 back blows</text>
<text x="120" y="177" font-size="14" text-anchor="middle" fill="#9aa8a0">(shoulder blades)</text>
<rect x="262" y="134" width="196" height="52" rx="12" fill="#161c1a" stroke="#ff8a1f" stroke-width="4"/>
<text x="360" y="158" font-size="17" font-weight="800" text-anchor="middle">5 abdominal thrusts</text>
<text x="360" y="177" font-size="14" text-anchor="middle" fill="#9aa8a0">(belly)</text>
<line x1="222" y1="160" x2="247.0" y2="160.0" stroke="#ff8a1f" stroke-width="4" stroke-linecap="round"/><polygon points="258.0,160.0 247.0,167.0 247.0,153.0" fill="#ff8a1f"/>
<path d="M360,190 V204 H120 V192" fill="none" stroke="#ff8a1f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="120,188 112,200 128,200" fill="#ff8a1f"/>
<text x="240" y="224" font-size="16" font-weight="700" text-anchor="middle">Keep alternating 5 and 5.</text>
<circle cx="96" cy="272" r="22" fill="#161c1a" stroke="#e8efe9" stroke-width="4"/>
<rect x="34" y="304" width="124" height="232" rx="36" fill="#161c1a" stroke="#e8efe9" stroke-width="4"/>
<line x1="96" y1="334" x2="96" y2="386" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
<path d="M96,386 Q62,380 48,338 M96,386 Q130,380 144,338" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
<circle cx="96" cy="512" r="6" fill="#e8efe9"/>
<rect x="68" y="438" width="56" height="36" rx="12" fill="#ff8a1f"/>
<rect x="66" y="420" width="60" height="22" rx="10" fill="none" stroke="#e8efe9" stroke-width="3.5"/>
<path d="M34,446 Q46,478 70,466 M158,446 Q146,478 122,466" fill="none" stroke="#e8efe9" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 9"/>
<line x1="96" y1="342" x2="186" y2="342" stroke="#38bdf8" stroke-width="3"/><circle cx="96" cy="342" r="4" fill="#38bdf8"/><text x="194" y="348" font-size="15" font-weight="800" fill="#38bdf8">Breastbone</text><text x="194" y="368" font-size="15" fill="#e8efe9">(not here)</text>
<line x1="124" y1="456" x2="186" y2="456" stroke="#ff8a1f" stroke-width="3"/><circle cx="124" cy="456" r="4" fill="#ff8a1f"/><text x="194" y="444" font-size="15" font-weight="800" fill="#ff8a1f">Fist: just above the</text><text x="194" y="464" font-size="15" fill="#e8efe9">navel, well below</text><text x="194" y="484" font-size="15" fill="#e8efe9">the breastbone.</text>
<line x1="102" y1="512" x2="186" y2="512" stroke="#e8efe9" stroke-width="3"/><circle cx="102" cy="512" r="4" fill="#e8efe9"/><text x="194" y="516" font-size="15" font-weight="800" fill="#e8efe9">Navel</text>
<rect x="22" y="550" width="436" height="120" rx="12" fill="#2a1010" stroke="#ef4444" stroke-width="4"/>
<path d="M90,566 Q68,600 70,616 Q68,640 88,656" fill="none" stroke="#e8efe9" stroke-width="5" stroke-linecap="round"/>
<circle cx="70" cy="616" r="14" fill="#ff8a1f"/>
<line x1="76" y1="622" x2="121.3" y2="586.8" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/><polygon points="130.0,580.0 125.6,592.3 117.0,581.2" fill="#ef4444"/>
<text x="150" y="594" font-size="19" font-weight="800" fill="#ef4444">Pull sharply</text>
<text x="150" y="620" font-size="19" font-weight="800" fill="#ef4444">inward and upward.</text>
<text x="150" y="648" font-size="14" fill="#9aa8a0">(side view)</text>
<text x="24" y="696" font-size="15" fill="#9aa8a0">Stand behind. Wrap your arms</text>
<text x="24" y="718" font-size="15" fill="#9aa8a0">around the waist. Thumb side of</text>
<text x="24" y="738" font-size="15" fill="#9aa8a0">the fist against the belly. Grab</text>
<text x="24" y="758" font-size="15" fill="#9aa8a0">the fist with your other hand.</text>
<rect x="22" y="786" width="436" height="78" rx="12" fill="#161c1a" stroke="#ff8a1f" stroke-width="3"/>
<text x="38" y="812" font-size="16" font-weight="800" fill="#ff8a1f">Pregnant or very large person:</text>
<text x="38" y="834" font-size="15">5 chest thrusts instead. Fist on the middle</text>
<text x="38" y="854" font-size="15">of the breastbone, thrust firmly backward.</text>
</g></svg>
