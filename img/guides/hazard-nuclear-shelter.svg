<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 844" role="img" aria-label="Get inside, stay inside, stay tuned. A house cross-section showing the best spots to shelter: 1, the innermost room on the lowest floor, or 2, a basement, with windows and doors closed. Get inside: go into the nearest building and bring family and pets in. Stay inside: close all doors and windows, turn off heating, air conditioning and vent or exhaust fans, and close fireplace dampers. Stay tuned: listen to your local Emergency Alert System radio or TV station and phone alerts. Stay at least 24 hours unless there is an immediate hazard or officials say it is safe."><title>Get inside, stay inside, stay tuned</title>
<rect x="1.5" y="1.5" width="477" height="841" rx="14" fill="#1f2724" stroke="#2c3632" stroke-width="3"/>
<g font-family="Inter, -apple-system, system-ui, sans-serif" fill="#e8efe9">
<text x="240" y="38" font-size="22" font-weight="800" text-anchor="middle">Get inside. Stay inside. Stay tuned.</text>
<rect x="22" y="230" width="436" height="108" fill="#2c3632" opacity="0.55"/>
<line x1="22" y1="230" x2="458" y2="230" stroke="#9aa8a0" stroke-width="3" stroke-dasharray="8 6"/>
<text x="430" y="222" font-size="14" text-anchor="middle" fill="#9aa8a0">ground</text>
<path d="M80,230 V130 L240,70 L400,130 V230" fill="#161c1a" stroke="#e8efe9" stroke-width="5" stroke-linejoin="round"/>
<rect x="80" y="230" width="320" height="98" fill="#22c55e" fill-opacity="0.22" stroke="#e8efe9" stroke-width="5"/>
<rect x="190" y="150" width="100" height="80" fill="#22c55e" fill-opacity="0.22" stroke="#22c55e" stroke-width="4" stroke-dasharray="3 0"/>
<circle cx="240" cy="190" r="16" fill="#22c55e"/><text x="240" y="196" font-size="18" font-weight="800" text-anchor="middle" fill="#0d1110">1</text>
<circle cx="240" cy="280" r="16" fill="#22c55e"/><text x="240" y="286" font-size="18" font-weight="800" text-anchor="middle" fill="#0d1110">2</text>
<text x="104" y="280" font-size="15" font-weight="800" text-anchor="start">BASEMENT</text>
<rect x="100" y="168" width="48" height="34" fill="#ff8a1f" fill-opacity="0.3" stroke="#ff8a1f" stroke-width="4"/><line x1="124" y1="168" x2="124" y2="202" stroke="#ff8a1f" stroke-width="3"/>
<rect x="330" y="168" width="48" height="34" fill="#ff8a1f" fill-opacity="0.3" stroke="#ff8a1f" stroke-width="4"/><line x1="354" y1="168" x2="354" y2="202" stroke="#ff8a1f" stroke-width="3"/>
<text x="240" y="138" font-size="14" font-weight="700" text-anchor="middle" fill="#ff8a1f">windows and doors closed</text>
<text x="240" y="98" font-size="16" font-weight="800" text-anchor="middle">HOUSE</text>
<circle cx="40" cy="370" r="15" fill="#22c55e"/><text x="40" y="376" font-size="18" font-weight="800" text-anchor="middle" fill="#0d1110">1</text>
<text x="66" y="376" font-size="16" font-weight="700">Innermost room on the lowest floor</text>
<circle cx="40" cy="406" r="15" fill="#22c55e"/><text x="40" y="412" font-size="18" font-weight="800" text-anchor="middle" fill="#0d1110">2</text>
<text x="66" y="412" font-size="16" font-weight="700">Or a basement</text>
<rect x="22" y="438" width="436" height="88" rx="12" fill="#161c1a" stroke="#ff8a1f" stroke-width="3"/>
<text x="38" y="466" font-size="19" font-weight="800" fill="#ff8a1f">GET INSIDE</text>
<text x="38" y="492" font-size="16">The nearest building. Bring family</text>
<text x="38" y="514" font-size="16">and pets in.</text>
<rect x="22" y="536" width="436" height="110" rx="12" fill="#161c1a" stroke="#ff8a1f" stroke-width="3"/>
<text x="38" y="564" font-size="19" font-weight="800" fill="#ff8a1f">STAY INSIDE</text>
<text x="38" y="590" font-size="16">Close all doors and windows. Turn off</text>
<text x="38" y="612" font-size="16">heating, A/C and vent or exhaust fans.</text>
<text x="38" y="634" font-size="16">Close fireplace dampers.</text>
<rect x="22" y="656" width="436" height="88" rx="12" fill="#161c1a" stroke="#ff8a1f" stroke-width="3"/>
<text x="38" y="684" font-size="19" font-weight="800" fill="#ff8a1f">STAY TUNED</text>
<text x="38" y="710" font-size="16">Local Emergency Alert System radio</text>
<text x="38" y="732" font-size="16">or TV station, and phone alerts.</text>
<rect x="22" y="754" width="436" height="74" rx="12" fill="#2a1010" stroke="#ef4444" stroke-width="3"/>
<text x="38" y="782" font-size="17" font-weight="800" fill="#ef4444">Stay at least 24 hours</text>
<text x="38" y="806" font-size="15">unless there is an immediate hazard or officials say it is safe.</text>
</g></svg>
