<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1046" role="img" aria-label="Pump or pod trouble, what to do. A pump or pod uses only rapid-acting insulin, so act as soon as you suspect a problem. First figure out what is wrong: check blood sugar with the meter and check ketones if it is 250 mg/dL or higher or you feel sick; check the pump or pod alarm; check the site for leaking, redness, swelling, a slipped or kinked cannula or loose adhesive; for tubing pumps check for air bubbles, a loose connector or a set not changed in 2 to 3 days; check for expired or heat-exposed insulin and do not use a pump that was dropped or hit. If not fixed right away: change the whole infusion set and site or use a new pod, correct by syringe or pen using the numbers from your plan, drink sugar-free fluids, 8 to 12 ounces every 30 minutes, and recheck every 1 to 2 hours. If glucose will not come down or you vomit, call your provider, go to the ER or call 911."><title>Pump or pod trouble</title>
<rect x="1.5" y="1.5" width="477" height="1043" rx="14" fill="#1f2724" stroke="#2c3632" stroke-width="3"/>
<g font-family="Inter, -apple-system, system-ui, sans-serif" fill="#e8efe9">
<text x="240" y="38" font-size="22" font-weight="800" text-anchor="middle">Pump or pod trouble: what to do</text>
<rect x="22" y="54" width="436" height="76" rx="12" fill="#2a1010" stroke="#ef4444" stroke-width="3"/>
<text x="38" y="82" font-size="16" font-weight="800" fill="#ef4444">A pump or pod uses only rapid-acting insulin.</text>
<text x="38" y="104" font-size="15">If delivery stops, sugar and ketones can climb fast.</text>
<text x="38" y="122" font-size="15">Don't wait and hope. Act as soon as you suspect it.</text>
<rect x="22" y="146" width="436" height="36" rx="10" fill="#ff8a1f"/><text x="38" y="171" font-size="19" font-weight="800" fill="#0d1110">FIRST: FIGURE OUT WHAT'S WRONG</text>
<rect x="22" y="192" width="436" height="64" rx="10" fill="#161c1a" stroke="#ff8a1f" stroke-width="3"/><circle cx="48" cy="224.0" r="14" fill="#ff8a1f"/><text x="48" y="230.0" font-size="18" font-weight="800" text-anchor="middle" fill="#0d1110">1</text><text x="76" y="219.0" font-size="16">Meter: check blood sugar. 250 mg/dL</text><text x="76" y="241.0" font-size="16">or higher, or feel sick? Check ketones.</text><line x1="240" y1="257" x2="240.0" y2="256.0" stroke="#ff8a1f" stroke-width="3" stroke-linecap="round"/><polygon points="240.0,267.0 233.0,256.0 247.0,256.0" fill="#ff8a1f"/><rect x="22" y="268" width="436" height="86" rx="10" fill="#161c1a" stroke="#ff8a1f" stroke-width="3"/><circle cx="48" cy="311.0" r="14" fill="#ff8a1f"/><text x="48" y="317.0" font-size="18" font-weight="800" text-anchor="middle" fill="#0d1110">2</text><text x="76" y="295.0" font-size="16">Pump or pod: delivery-stopped alarm?</text><text x="76" y="317.0" font-size="16">Clear it, restart delivery. Omnipod hazard</text><text x="76" y="339.0" font-size="16">alarm: silence, remove the pod, start a new one.</text><line x1="240" y1="355" x2="240.0" y2="354.0" stroke="#ff8a1f" stroke-width="3" stroke-linecap="round"/><polygon points="240.0,365.0 233.0,354.0 247.0,354.0" fill="#ff8a1f"/><rect x="22" y="366" width="436" height="86" rx="10" fill="#161c1a" stroke="#ff8a1f" stroke-width="3"/><circle cx="48" cy="409.0" r="14" fill="#ff8a1f"/><text x="48" y="415.0" font-size="18" font-weight="800" text-anchor="middle" fill="#0d1110">3</text><text x="76" y="393.0" font-size="16">Site: wet or leaking, insulin smell, red or</text><text x="76" y="415.0" font-size="16">swollen, cannula slipped or kinked, or</text><text x="76" y="437.0" font-size="16">adhesive loose.</text><line x1="240" y1="453" x2="240.0" y2="452.0" stroke="#ff8a1f" stroke-width="3" stroke-linecap="round"/><polygon points="240.0,463.0 233.0,452.0 247.0,452.0" fill="#ff8a1f"/><rect x="22" y="464" width="436" height="64" rx="10" fill="#161c1a" stroke="#ff8a1f" stroke-width="3"/><circle cx="48" cy="496.0" r="14" fill="#ff8a1f"/><text x="48" y="502.0" font-size="18" font-weight="800" text-anchor="middle" fill="#0d1110">4</text><text x="76" y="491.0" font-size="16">Tubing pump: air bubbles, loose connector,</text><text x="76" y="513.0" font-size="16">or set not changed in 2 to 3 days.</text><line x1="240" y1="529" x2="240.0" y2="528.0" stroke="#ff8a1f" stroke-width="3" stroke-linecap="round"/><polygon points="240.0,539.0 233.0,528.0 247.0,528.0" fill="#ff8a1f"/><rect x="22" y="540" width="436" height="86" rx="10" fill="#161c1a" stroke="#ff8a1f" stroke-width="3"/><circle cx="48" cy="583.0" r="14" fill="#ff8a1f"/><text x="48" y="589.0" font-size="18" font-weight="800" text-anchor="middle" fill="#0d1110">5</text><text x="76" y="567.0" font-size="16">Insulin expired or heat-exposed? Use new.</text><text x="76" y="589.0" font-size="16">Pump dropped or hit and may be damaged?</text><text x="76" y="611.0" font-size="16">Don't use it.</text><line x1="240" y1="627" x2="240.0" y2="626.0" stroke="#ff8a1f" stroke-width="3" stroke-linecap="round"/><polygon points="240.0,637.0 233.0,626.0 247.0,626.0" fill="#ff8a1f"/>
<line x1="240" y1="628" x2="240.0" y2="639.0" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/><polygon points="240.0,650.0 233.0,639.0 247.0,639.0" fill="#ef4444"/>
<rect x="22" y="654" width="436" height="36" rx="10" fill="#ef4444"/><text x="38" y="679" font-size="19" font-weight="800" fill="#0d1110">NOT FIXED RIGHT AWAY</text>
<rect x="22" y="700" width="436" height="64" rx="10" fill="#161c1a" stroke="#ef4444" stroke-width="3"/><circle cx="48" cy="732.0" r="14" fill="#ef4444"/><text x="48" y="738.0" font-size="18" font-weight="800" text-anchor="middle" fill="#0d1110">1</text><text x="76" y="727.0" font-size="16">Change the whole infusion set and site</text><text x="76" y="749.0" font-size="16">(new cartridge, fresh insulin), or a new pod.</text><line x1="240" y1="765" x2="240.0" y2="764.0" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/><polygon points="240.0,775.0 233.0,764.0 247.0,764.0" fill="#ef4444"/><rect x="22" y="776" width="436" height="64" rx="10" fill="#161c1a" stroke="#ef4444" stroke-width="3"/><circle cx="48" cy="808.0" r="14" fill="#ef4444"/><text x="48" y="814.0" font-size="18" font-weight="800" text-anchor="middle" fill="#0d1110">2</text><text x="76" y="803.0" font-size="16">Correct by syringe or pen. Use the numbers</text><text x="76" y="825.0" font-size="16">from your plan. Don't guess.</text><line x1="240" y1="841" x2="240.0" y2="840.0" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/><polygon points="240.0,851.0 233.0,840.0 247.0,840.0" fill="#ef4444"/><rect x="22" y="852" width="436" height="64" rx="10" fill="#161c1a" stroke="#ef4444" stroke-width="3"/><circle cx="48" cy="884.0" r="14" fill="#ef4444"/><text x="48" y="890.0" font-size="18" font-weight="800" text-anchor="middle" fill="#0d1110">3</text><text x="76" y="879.0" font-size="16">Sugar-free fluids: 8 to 12 ounces every</text><text x="76" y="901.0" font-size="16">30 minutes. Recheck every 1 to 2 hours.</text><line x1="240" y1="917" x2="240.0" y2="916.0" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/><polygon points="240.0,927.0 233.0,916.0 247.0,916.0" fill="#ef4444"/>
<rect x="22" y="928" width="436" height="102" rx="12" fill="#2a1010" stroke="#ef4444" stroke-width="4"/>
<text x="38" y="958" font-size="17" font-weight="800" fill="#ef4444">Glucose won't come down, or vomiting?</text>
<text x="38" y="986" font-size="16">Call your provider, go to the ER,</text>
<text x="38" y="1008" font-size="16">or call 911.</text>
</g></svg>
